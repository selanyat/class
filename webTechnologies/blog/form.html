<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="./styles/blog.css">
		<link rel="stylesheet" href="./styles/form.css"/>
		<title>Form</title>
	</head>
	<body>
		<h1>Contact Us</h1>
		<div id="form">
			<form>
				<div>
					<label for="name">Name</label>
					<input id="name" name="name" placeholder="John Doe" type="text" />
				</div>

				<div>
					<label for="email">Email</label>
					<input id="email" name="email" placeholder="example@domain.com" type="email" />
				</div>

				<div>
					<label for="phone">Phone</label>
					<input for="phone" name="phone" placeholder="0200000000" type="tel" maxlength=10 />
				</div>

				<div>
					<label for="dob">Date of Birth</label>
					<input id="dob" name="dob" type="date" />
				</div>

				<div>
					<label for="gender">Gender</label>
					<input id="male" name="gender" type="radio" value="Male" /><label for="male">Male</label>
					<input id="female" name="gender" type="radio" value="Female"/><label for="female">Female</label>
				</div>

				<div>
					<button>Submit</button>
				</div>
			</form>
		</div>
	</body>
</html>
